<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8/3!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="step1-envelope" onclick="openEnvelope()">
        <p class="envelope-icon">✉️</p>
        <p class="instruction">Nhấn vào để mở thư nhé!</p>
    </div>

    <div id="step2-letter" class="hidden">
        <div id="greeting-text-container" class="greeting-text">
            <h2 id="line1"></h2>
            <p id="line2"></p>
            <p id="line3"></p>
        </div>
        
        <div id="khaby-gift-container" class="hidden" onclick="openGift()">
            <img src="khaby_surprised.jpg" alt="Mở quà đi" class="khaby-image-mid">
            <span class="central-gift-icon">🎁</span>
            <p class="instruction" style="margin-top: 10px;">Click vào đây đi, đừng thấy da den mà sợ :)))</p>
        </div>
    </div>

    <div id="step3-surprise" class="hidden">
        <h1>Tadaaa! Bất ngờ chưa! =)))))</h1>
        <img src="image_1a2add.jpg" alt="Mèo cầm hoa" class="cat-image">
        
        <p id="final-punchline" class="hidden" style="margin-top: 20px;">Hết rồi! ko còn gì đâu cám ơn tớ đi 🥲</p>
        
        <div class="button-group">
            <button id="thank-btn" class="hidden" onclick="sayThanks()">Cảm ơn nha</button>
            <button id="dislike-btn" class="hidden"> Thử chê xem! </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
